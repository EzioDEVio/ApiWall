name: Weekly catalog sync

# Pulls the latest public-apis catalog, fetches logos for new listings, checks every docs
# link, and opens a pull request when anything changed. Existing tiles never move.
# It also refreshes the README's "This week on ApiWall" section and keeps one "Docs-link health"
# issue up to date (label: link-health).
# One-time setup: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import the upstream catalog
        run: npm run catalog:import
      - name: Fetch logos for new listings
        run: npm run catalog:logos
      - name: Check every docs link
        # A failed check never blocks the sync; the site keeps last week's results.
        continue-on-error: true
        timeout-minutes: 40
        run: npm run links:check
      - run: npm test
      - name: Write this week's report (README section, pull request text, health issue)
        run: npm run sync:report -- --out "$RUNNER_TEMP/report"
      - name: Skip the pull request when only timestamps changed
        run: node scripts/drop-timestamp-only-changes.mjs
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/catalog-sync
          commit-message: "chore: sync public-apis catalog"
          title: "Weekly catalog sync"
          body-path: ${{ runner.temp }}/report/pr-body.md
          labels: catalog
          delete-branch: true
      - name: Update the Docs-link health issue
        # Reporting only: a hiccup here never fails the sync.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create link-health --color c0262d --description "Weekly docs-link check report" --force
          number=$(gh issue list --label link-health --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/report/health-issue.md"
          else
            gh issue create --title "Docs-link health" --label link-health --body-file "$RUNNER_TEMP/report/health-issue.md"
          fi
